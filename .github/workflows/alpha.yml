name: Alpha candidate

on:
  push:
    branches: [main]
    paths: [release.json]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: alpha-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'fgrzesiak/powertrove' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Require a merged release pull request for this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $response = gh api "repos/$env:REPOSITORY/commits/$env:REVISION/pulls"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify merged pull request.' }
          $matches = @($response | ConvertFrom-Json | Where-Object {
            $_.merged_at -and $_.base.ref -eq 'main' -and $_.merge_commit_sha -eq $env:REVISION -and
            $_.head.ref -like 'release/*' -and $_.head.repo.full_name -ceq $env:REPOSITORY
          })
          if ($matches.Count -eq 0) { throw 'This commit must arrive through a merged pull request into main.' }
      - name: Checkout exact public commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Select temporary candidate output
        shell: pwsh
        run: |
          "POWERTROVE_ALPHA_OUTPUT=$(Join-Path $env:RUNNER_TEMP 'powertrove-alpha')" >> $env:GITHUB_ENV
      - name: Select the release driver
        id: driver
        shell: pwsh
        run: |
          $release = Get-Content release.json -Raw | ConvertFrom-Json
          $managed = $release.automation -and $release.automation.driver -ceq 'contextbar-manifest'
          "managed=$($managed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Refuse an already tagged release
        if: steps.driver.outputs.managed != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-Content release.json -Raw | ConvertFrom-Json
          if ($release.version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' -or
              "$($release.sequence)" -cnotmatch '^[1-9][0-9]{0,5}$' -or $release.channel -cne 'alpha') {
            throw 'Invalid alpha version.'
          }
          $tag = "v$($release.version)-alpha.$($release.sequence)"
          $response = gh api "repos/$env:REPOSITORY/git/matching-refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify release tag availability.' }
          $existing = @($response | ConvertFrom-Json | Where-Object { $_.ref -ceq "refs/tags/$tag" })
          if ($existing.Count) { throw 'Release tag already exists. Prepare a new alpha sequence.' }
      - name: Set up .NET 10
        if: steps.driver.outputs.managed != 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Set up Node.js for signed pack planning
        if: steps.driver.outputs.managed != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Build Windows solution
        if: steps.driver.outputs.managed != 'true'
        timeout-minutes: 15
        shell: pwsh
        run: ./scripts/build-alpha.ps1 -Phase Build
      - name: Test Windows solution
        if: steps.driver.outputs.managed != 'true'
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/build-alpha.ps1 -Phase Test
      - name: Retain test diagnostics
        if: always() && steps.driver.outputs.managed != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alpha-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.POWERTROVE_ALPHA_OUTPUT }}/test-results/**/*.trx
            ${{ env.POWERTROVE_ALPHA_OUTPUT }}/test-results/**/*.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Package Windows x64 candidate
        if: steps.driver.outputs.managed != 'true'
        timeout-minutes: 15
        shell: pwsh
        run: ./scripts/build-alpha.ps1 -Phase Package
      - name: Check published application startup and icon
        if: steps.driver.outputs.managed != 'true'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $release = Get-Content release.json -Raw | ConvertFrom-Json
          ./scripts/smoke-startup.ps1 -Executable "${{ env.POWERTROVE_ALPHA_OUTPUT }}/PowerTrove-v$($release.version)-win-x64/PowerTrove.exe"
      - name: Set up verified Inno Setup 6.7.3
        if: steps.driver.outputs.managed != 'true'
        id: inno
        timeout-minutes: 5
        shell: pwsh
        run: |
          $iscc = & ./scripts/setup-inno.ps1
          "iscc=$iscc" >> $env:GITHUB_OUTPUT
      - name: Compile per-user installer
        if: steps.driver.outputs.managed != 'true'
        timeout-minutes: 10
        shell: pwsh
        env:
          ISCC_PATH: ${{ steps.inno.outputs.iscc }}
        run: ./scripts/build-alpha.ps1 -Phase Installer -Iscc $env:ISCC_PATH
      - name: Retain exact candidate for acceptance
        if: steps.driver.outputs.managed != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alpha-win-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.POWERTROVE_ALPHA_OUTPUT }}/*.zip
            ${{ env.POWERTROVE_ALPHA_OUTPUT }}/*-installer.exe
            ${{ env.POWERTROVE_ALPHA_OUTPUT }}/SHA256SUMS
            ${{ env.POWERTROVE_ALPHA_OUTPUT }}/candidate.json
            ${{ env.POWERTROVE_ALPHA_OUTPUT }}/packs/pack-plan.json
            ${{ env.POWERTROVE_ALPHA_OUTPUT }}/packs/pack-versions.props
          if-no-files-found: error
          retention-days: 14
